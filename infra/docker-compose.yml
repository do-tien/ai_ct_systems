# OPTIONAL, SECONDARY PACKAGING PATH — NOT native acceptance (LC1-18).
# STATUS: incomplete / DEFERRED. The `backend` image is Go-only (backend/Dockerfile
# has no Python interpreter or AI dependencies) and the `backend` service sets no
# AI_PYTHON / AI_BUNDLE_DIR / AI_JOB_DIR / AI_DEVICE, so this Compose file cannot
# run the LC1-12 AI worker. Do NOT present `up --wait` as full-runtime proof.
# The native runbook is docs/lc1-18-native-runtime.md; Docker evidence is tracked
# separately in docs/lc1-18-runtime-verification.md and is currently DEFERRED.
name: nodule-reader

services:
  postgres:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required (see .env.example)}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  orthanc:
    image: orthancteam/orthanc:26.9.1@sha256:d2705f2c56547e55ce9bc2250fd22d05d326493b3f3d9fa191ecb7db8ca6b5a2
    environment:
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: "{\"${ORTHANC_USER:?ORTHANC_USER is required (see .env.example)}\": \"${ORTHANC_PASSWORD:?ORTHANC_PASSWORD is required (see .env.example)}\"}"
    volumes:
      - ./orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc_data:/var/lib/orthanc/db
    healthcheck:
      test: ["CMD", "python3", "/probes/test-aliveness.py"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ../backend
    environment:
      HTTP_ADDR: ":8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required (see .env.example)}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USER: ${ORTHANC_USER:?ORTHANC_USER is required (see .env.example)}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:?ORTHANC_PASSWORD is required (see .env.example)}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      orthanc:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_started

  service_exampl:
    build:
      context: ../service_exampl
    profiles: ["tools"]

volumes:
  postgres_data:
  orthanc_data:
