[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nodule-ai"
version = "0.1.0"
description = "Packaging for the nodule-reader AI worker: LIDC data tools only, no inference implemented yet."
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
# Native data/reference tooling (LC1-02). Exact resolved set is frozen in
# requirements-data.txt; these bounds describe the intended compatible range.
data = [
    "idc-index==0.13.0",
    "pylidc==0.2.3",
    "numpy==1.23.5",  # pylidc 0.2.3 uses np.int, removed in numpy 1.24
    "pydicom==2.4.4",
]

# Native AI runtime (LC1-03). torch/torchvision must come from the official CPU
# index (download.pytorch.org/whl/cpu); the exact resolved set, flavour and wheel
# hashes are frozen in requirements-ai-cpu.txt — install from that lock.
# torch 2.4.1 (not the bundle metadata pin 2.4.0): the 2.4.0 Windows cpu wheel
# hard-imports libomp140.x86_64.dll, which no VC++ redistributable provides.
ai = [
    "monai==1.4.0",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "numpy==1.24.4",
    "nibabel==5.2.1",
    "pytorch-ignite==0.4.11",
    "tensorboard==2.17.0",
    "SimpleITK==2.4.0",
    "pydicom==2.4.4",  # geometry decode used by the inference CLI
    "psutil==6.0.0",  # portable peak-RSS sampling
]

# Native geometry/volume tooling (LC1-04): SimpleITK decode + nibabel NIfTI.
# Exact resolved set and wheel hashes live in requirements-geometry.txt.
geometry = [
    "pydicom==2.4.4",
    "SimpleITK==2.4.0",
    "nibabel==5.2.1",
    "numpy>=1.23.5,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
